[package]
name = "vistaverge"
version = "0.1.0-beta.1"
description = "VistaVerge 桌面版（Tauri）"
authors = ["you"]
edition = "2021"

[lib]
name = "vistaverge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：启用 asset 协议（tauri.conf.json 的 assetProtocol），
# 用于加载用户导入的 Live2D 模型（scope 限定 $APPDATA/live2d/**）。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS 凭据仓（keyring v3 按平台特性开关）；本机 Windows 用 windows-native，
# apple-native 供未来 macOS 构建复用（cfg 门控，不引入额外编译负担）。
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }

[profile.release]
strip = true
lto = "thin"
